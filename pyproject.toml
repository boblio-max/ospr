[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ospr"
version = "0.1.0"
description = "Opposite Seesaw Parameter Reduction Method — 2:1 weight compression via polar (theta, half-length) encoding with Bhaskara I trig approximation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["deep-learning", "compression", "pytorch", "polar", "bhaskara"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.20",
]
authors = [{ name = "OSPR Contributors" }]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["torch>=2.0", "pytest", "ruff", "mypy"]
all = ["torch>=2.0", "numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/ospr/ospr"
Repository = "https://github.com/ospr/ospr"
Issues = "https://github.com/ospr/ospr/issues"

[tool.setuptools.packages.find]
include = ["ospr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
